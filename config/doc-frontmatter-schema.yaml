# doc-frontmatter-schema.yaml
# Schema for mandatory YAML frontmatter in agentic documentation.

globals:
  allowed_status: [active, draft, deprecated, research, in-progress, complete, escalated]
  allowed_severity: [low, medium, high, critical]

doc_types:
  skill:
    required:
      - doc_type
      - id
      - title
      - status
      - tags
    optional:
      - version
      - last_reviewed
    examples:
      doc_type: skill
      id: strict-json-output-contract
      title: Strict JSON Output Contract
      status: active
      tags: [json, prompt-contract, validation]

  prd:
    required:
      - doc_type
      - id
      - title
      - status
      - owner
    optional:
      - phase
      - priority
    examples:
      doc_type: prd
      id: technical-analysis-prd
      title: Technical Analysis PRD
      status: active
      owner: hyperd

  plan:
    required:
      - doc_type
      - id
      - title
      - status
      - parent_prd
    optional:
      - phase
      - objective
    examples:
      doc_type: plan
      id: phase-92-doc-frontmatter
      title: "Phase 92.1: Doc Frontmatter"
      status: in-progress
      parent_prd: technical-analysis-prd

  handoff:
    required:
      - doc_type
      - date
      - status
    optional:
      - phase
      - commit
    examples:
      doc_type: handoff
      date: "2026-05-31"
      status: complete

  memory:
    required:
      - doc_type
      - id
      - title
    optional:
      - tags
      - last_updated
    examples:
      doc_type: memory
      id: memory-index
      title: Private Project Memory Index

  reference:
    required:
      - doc_type
      - title
    optional:
      - source
      - tags
    examples:
      doc_type: reference
      title: System Overview

  integration-contract:
    required:
      - doc_type
      - id
      - title
      - status
      # Semantic identity of a contract: it MUST declare whether it grants build/runtime authority.
      # Optional here let a semantically-empty doc claim an active contract (Codex catch-up DEFECT[MEDIUM]).
      - implementation_authority
      - runtime_authority
    optional:
      - parent_prd
      - date
      - parties
    examples:
      doc_type: integration-contract
      id: herdr-h2-canonical-aq--operator-context
      title: "Integration Contract: Canonical AQ <-> operator-context"
      status: draft

  design-packet:
    required:
      - doc_type
      - id
      - title
      - status
    optional:
      - parent_prd
      - slice
      - revision
      - depends_on
      - authorization
    examples:
      doc_type: design-packet
      id: teg-c1-design-packet-20260808
      title: TEG C1 Contract and Nix-Boundary Design Packet
      status: draft

  design-review:
    required:
      - doc_type
      - id
      - title
      - status
      # A review with no verdict/reviewer is not a review (Codex catch-up DEFECT[MEDIUM]).
      - reviewer
      - verdict
    optional:
      - parent_prd
      - review_role
      - subject
      - subject_sha256
      - date
      - head
      - slice
    examples:
      doc_type: design-review
      id: teg-c1-design-review-20260808
      title: TEG C1 Independent Architecture Review
      status: draft

  implementation-review:
    required:
      - doc_type
      - id
      - title
      - status
      - reviewer
      - verdict
    optional:
      - parent_prd
      - review_role
      - subject
      - subject_sha256
      - date
      - head
      - slice
    examples:
      doc_type: implementation-review
      id: review-convergence-rev1-independent-review-20260815
      title: Bounded Review Convergence Independent Review
      status: complete
      reviewer: independent-reviewer
      verdict: REQUEST_REVISION

  collaboration-brief:
    required:
      - doc_type
      - id
      - status
    optional:
      - owner
      - date
      - parent_prd
      - title
    examples:
      doc_type: collaboration-brief
      id: herdr-h2-claude-codex
      status: draft
