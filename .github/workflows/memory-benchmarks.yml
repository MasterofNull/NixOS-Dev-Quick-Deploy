name: Memory Benchmarks

on:
  push:
    branches: [ main, develop, cursor/* ]
    paths:
      - "ai-stack/aidb/**"
      - "scripts/testing/memory-regression-tests.py"
      - ".github/workflows/memory-benchmarks.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "ai-stack/aidb/**"
      - "scripts/testing/memory-regression-tests.py"
      - ".github/workflows/memory-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-benchmark-regressions:
    name: Memory Benchmark Regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Install benchmark dependencies
        run: |
          uv pip install --system pyyaml psutil

      - name: Run memory benchmark regression checks
        run: |
          python scripts/testing/memory-regression-tests.py
