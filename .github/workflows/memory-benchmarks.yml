name: Memory Benchmarks

on:
  push:
    branches: [ main, develop, cursor/* ]
    paths:
      - "ai-stack/aidb/**"
      - "scripts/testing/memory-regression-tests.py"
      - ".github/workflows/memory-benchmarks.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "ai-stack/aidb/**"
      - "scripts/testing/memory-regression-tests.py"
      - ".github/workflows/memory-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-benchmark-regressions:
    name: Memory Benchmark Regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      - name: Install benchmark dependencies
        run: |
          uv pip install --system pyyaml psutil

      - name: Run memory benchmark regression checks
        run: |
          python scripts/testing/memory-regression-tests.py
