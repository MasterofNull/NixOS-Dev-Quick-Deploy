name: Targeted Coverage

on:
  push:
    branches: [ main, develop, "cursor/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      - name: Install targeted coverage dependencies
        run: |
          uv pip install --system coverage pytest pytest-cov
          uv pip install --system -r dashboard/backend/requirements.txt
          uv pip install --system -r ai-stack/mcp-servers/hybrid-coordinator/requirements.txt

      - name: Run targeted coverage suites
        run: |
          chmod +x scripts/testing/run-targeted-coverage.sh
          ./scripts/testing/run-targeted-coverage.sh

      - name: Upload targeted coverage artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: targeted-coverage-artifacts
          path: .reports/coverage-targeted
