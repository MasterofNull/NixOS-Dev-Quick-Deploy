name: Targeted Coverage

on:
  push:
    branches: [ main, develop, "cursor/*" ]
    paths:
      - 'dashboard/**'
      - 'ai-stack/**'
      - 'scripts/**'
      - '.github/workflows/test-coverage.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'dashboard/**'
      - 'ai-stack/**'
      - 'scripts/**'
      - '.github/workflows/test-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      - name: Install targeted coverage dependencies
        run: |
          uv pip install --system coverage pytest pytest-cov
          uv pip install --system -r dashboard/backend/requirements.txt
          uv pip install --system -r ai-stack/mcp-servers/hybrid-coordinator/requirements.txt

      - name: Run targeted coverage suites
        run: |
          chmod +x scripts/testing/run-targeted-coverage.sh
          ./scripts/testing/run-targeted-coverage.sh

      - name: Upload targeted coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: targeted-coverage-artifacts
          path: .reports/coverage-targeted
