name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  repo-structure-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Enforce repository structure policy
        run: |
          chmod +x scripts/governance/repo-structure-lint.sh
          ./scripts/governance/repo-structure-lint.sh --all
      - name: Enforce root script shim-only policy
        run: |
          chmod +x scripts/governance/check-root-script-shim-only.sh
          ./scripts/governance/check-root-script-shim-only.sh

  flake-first-roadmap-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Syntax checks for deploy entrypoints and verifier
        run: |
          bash -n nixos-quick-deploy.sh scripts/deploy/deploy-clean.sh scripts/governance/analyze-clean-deploy-readiness.sh scripts/testing/verify-flake-first-roadmap-completion.sh

      - name: Verify flake-first roadmap completion markers
        run: ./scripts/testing/verify-flake-first-roadmap-completion.sh

      - name: Guard against unsupported gitleaks-action args usage
        run: |
          if rg -n "gitleaks/gitleaks-action@v2" .github/workflows; then
            echo "Unsupported gitleaks-action usage detected. Use explicit gitleaks CLI steps instead." >&2
            exit 1
          fi

  parity-scorecard-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # tier0's legacy-allowlist check diffs against the merge-base with origin/main and fails closed without it.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap apparmor-utils
          if ! bwrap --unshare-all --proc /proc --dev /dev --tmpfs /tmp -- /usr/bin/python3 -c pass 2>/dev/null; then
            sudo tee /etc/apparmor.d/aq-confine-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile aq-confine-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/aq-confine-bwrap>
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/aq-confine-bwrap || true  # NON-GATING: profile load is best-effort; confine tests fail on their own if bwrap is blocked
          fi
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema pydantic httpx aiohttp requests pytest fastapi cryptography rich psutil
      - name: Set up telemetry directory
        run: |
          sudo mkdir -p /var/lib/ai-stack/hybrid/telemetry
          sudo chown -R $(id -u):$(id -g) /var/lib/ai-stack
          chmod 700 /var/lib/ai-stack/hybrid/telemetry
          mkdir -p .agent/qa && chmod 700 .agent/qa
      - name: Make harness scripts executable
        run: |
          chmod +x scripts/testing/*.sh scripts/governance/*.sh scripts/automation/*.sh scripts/ai/*.sh 2>/dev/null || true  # NON-GATING: unmatched glob is fine; missing exec bit fails the run step
      - name: Validate eval pack schema (PAR-002)
        run: |
          scripts/testing/harness-runner.sh --offline --skip-parity
      - name: Run parity scorecard gate (PAR-002)
        run: |
          scripts/testing/harness-runner.sh --offline --skip-schema

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [aidb, hybrid-coordinator, nixos-docs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-stack/mcp-servers/${{ matrix.service }}/requirements.txt

      - name: Run service unit tests
        run: |
          set +e
          export PYTHONPATH=$PYTHONPATH:$(pwd)/ai-stack:$(pwd)/ai-stack/mcp-servers/${{ matrix.service }}
          pytest ai-stack/mcp-servers/${{ matrix.service }} -m "not integration" --cov=ai-stack/mcp-servers/${{ matrix.service }} --cov-report=term-missing
          rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "No pytest test files collected for ${{ matrix.service }}; skipping."
            exit 0
          fi
          exit "$rc"
