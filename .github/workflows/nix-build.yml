name: Nix Build

on:
  push:
    branches: [ main, develop, 'cursor/**' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  nix-build:
    name: Build NixOS Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72  # v30
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes
            
      - name: Check flake
        run: nix flake check --all-systems || true
      
      - name: Build hyperd-ai-dev configuration
        run: |
          # No `|| true`: a failed system build must fail this job (it previously always passed).
          nix build .#nixosConfigurations.hyperd-ai-dev.config.system.build.toplevel \
            --max-jobs 2 --cores 2 --print-build-logs
      
      - name: Build Summary
        if: always()
        run: |
          echo "### Nix Build Results 🔨" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built configurations:" >> $GITHUB_STEP_SUMMARY
          echo "- hyperd-ai-dev configuration" >> $GITHUB_STEP_SUMMARY
