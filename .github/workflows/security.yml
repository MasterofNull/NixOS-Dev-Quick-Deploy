name: Security Audit & Vulnerability Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly on Mondays at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-audit:
    name: Security Configuration Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq yq
          pip install pyyaml

      - name: Run security audit script
        id: audit
        run: |
          bash scripts/security/security-audit.sh > security-audit-results.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload audit results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: security-audit-results
          path: security-audit-results.txt
          retention-days: 30

      - name: Check audit results
        run: |
          cat security-audit-results.txt
          if grep -q "BLOCKING" security-audit-results.txt; then
            echo "::error::Security audit found blocking failures"
            exit 1
          fi
          if grep -q "CRITICAL" security-audit-results.txt; then
            echo "::warning::Security audit found critical issues"
          fi

      - name: Comment PR with audit results
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('security-audit-results.txt', 'utf8');
            const body = `## Security Audit Results\n\n\`\`\`\n${results}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  nix-closure-vuln-scan:
    name: Nix Closure Vulnerability Scan
    # Nix is the single source of truth for deployed dependencies (owner decision
    # 2026-10-01): scan the real hyperd-ai-dev system closure, not container images
    # or pip manifests.  Findings go to code scanning (non-blocking, as the former
    # Trivy jobs were); a build or scanner failure fails the job.
    runs-on: ubuntu-latest
    needs: security-audit
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72  # v30
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build hyperd-ai-dev system closure
        run: |
          # Bounded parallelism: llama-cpp's Vulkan shader generation forks many compilers per
          # job; the hosted runner's default (max-jobs=auto x all cores) exhausted it
          # ("Failed to fork process", then ld failure) on 2026-10-02.
          nix build .#nixosConfigurations.hyperd-ai-dev.config.system.build.toplevel \
            --max-jobs 2 --cores 2 \
            --print-build-logs --out-link result-toplevel
          test -e result-toplevel

      - name: Scan closure (sbomnix -> grype)
        run: |
          set -euo pipefail
          # nixpkgs comes from flake.lock so scanner versions track the deployed pin.
          # Errors are never suppressed: a crash in either scanner must fail the job.
          scripts/security/aq-closure-scan \
            --target "$(readlink -f result-toplevel)" \
            --sbom nix-closure.cdx.json \
            --sarif nix-closure.sarif \
            --json | tee nix-closure-summary.json
          test -s nix-closure.sarif

      - name: Upload Nix closure SARIF
        if: always() && hashFiles('nix-closure.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
        with:
          sarif_file: nix-closure.sarif
          category: nix-closure

      - name: Upload closure SBOM and summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: nix-closure-scan
          path: |
            nix-closure.cdx.json
            nix-closure-summary.json
          if-no-files-found: ignore

  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --redact \
            --config .gitleaks.toml \
            --source . \
            --no-git \
            --report-format sarif \
            --report-path gitleaks-security.sarif \
            --exit-code 1

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks-security.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
        with:
          sarif_file: gitleaks-security.sarif
          category: gitleaks-security

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [security-audit, nix-closure-vuln-scan, secrets-scan]
    if: always()
    steps:
      - name: Download audit results
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: security-audit-results

      - name: Security Summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Audit" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.security-audit.result }}" == "success" ]; then
            echo "✅ Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Vulnerability Scans" >> $GITHUB_STEP_SUMMARY
          echo "- Nix Closure: ${{ needs.nix-closure-vuln-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Additional Checks" >> $GITHUB_STEP_SUMMARY
          echo "- Secret Detection: ${{ needs.secrets-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 See the Security tab for detailed vulnerability reports" >> $GITHUB_STEP_SUMMARY
