      version: "3.53.3"
    reason: "sqlite 3.53.3 (fixed 3.54.0; nixos-26.05 head still 3.53.3). Exception basis (applies to this CVE only): only matters when an application installs an authorizer (sqlite3_set_authorizer, SQLITE_READ denials); rg for set_authorizer over .py/.sql/.sh/.nix/.rs = 0 hits. Does not cover other consumers. WR-SEC-5 expires=2026-12-18; triage evidence docs/harness-first/evidence/2026-11-18-cve-triage-decisions.md"

