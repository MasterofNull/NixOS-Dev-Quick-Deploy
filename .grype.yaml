  - vulnerability: CVE-2026-119566
    package:
      name: prometheus
      version: "3.12.0"
    reason: "prometheus 3.12.0 (fixed in >3.15.1; unstable 3.16.0, nixos-26.05 has 3.12.0). Exception basis (applies to this CVE only): the leak needs Azure AD / Google IAM auth on a Prometheus remote_write that a redirect can divert. services.prometheus in nix/modules/services/monitoring.nix:625 configures no remoteWrite and no cloud auth (rg remote_write|azuread|sigv4|google over .nix/.yml/.py/.sh finds only Tempo metrics_generator at monitoring.nix:49, a different component writing to local Prometheus). Re-check on any monitoring.nix change. WR-SEC-9 expires=2027-02-16; triage evidence docs/harness-first/evidence/2026-11-18-cve-triage-decisions.md"

  - vulnerability: CVE-2026-119377
    package:
